name: pr-checks

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        command:
          - lint
          - test
          - check:types
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Run ${{ matrix.command }}
        run: npm run ${{ matrix.command }}


      
